<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rise | Focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;700&family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="focus">
    <main class="wrap">
      <section class="two">
        <div class="card tilt center">
          <h2>Focus mode</h2>
          <div class="gyrostage">
            <div class="gyro" id="gyro"><i></i><i></i><i></i></div>
            <div class="clock num" id="clock">25:00</div>
          </div>
          <div class="track"><div class="fill" id="tFill"></div></div>
          <div class="row crow">
            <button type="button" class="primary" id="tStart">Start</button>
            <button type="button" class="ghost" id="tReset">Reset</button>
            <select id="tLen" aria-label="Session length">
              <option value="15">15 min</option>
              <option value="25" selected>25 min</option>
              <option value="45">45 min</option>
            </select>
          </div>
        </div>
        <div class="stats one">
          <div class="card stat tilt">
            <p class="muted">Sessions today</p>
            <p class="num" id="fsToday">0</p>
          </div>
          <div class="card stat tilt">
            <p class="muted">Minutes today</p>
            <p class="num" id="fsMin">0</p>
          </div>
          <div class="card stat tilt sun">
            <p class="muted">All-time sessions</p>
            <p class="num" id="fsAll">0</p>
            <p class="small muted">Each session earns 25 XP</p>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
