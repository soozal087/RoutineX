<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rise | Hydration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;700&family=Orbitron:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="water">
    <main class="wrap">
      <section class="two">
        <div class="card tilt">
          <h2>Hydration tank</h2>
          <div class="tank3d" id="tank3d">
            <div class="tank" id="tank">
              <div class="water" id="water"><div class="wave"></div></div>
              <div class="bubs" id="bubs"></div>
              <span class="tpct num" id="tpct">0%</span>
            </div>
            <span class="drop d1"></span>
            <span class="drop d2"></span>
          </div>
        </div>
        <div class="card">
          <p class="muted">Today</p>
          <div class="big num">
            <span id="wAmt">0</span
            ><small> / <span id="wGoal">2000</span> ml</small>
          </div>
          <div class="glasses" id="glasses" aria-label="Glasses of water"></div>
          <div class="row" id="wBtns">
            <button type="button" class="primary" data-ml="150">+150</button>
            <button type="button" class="primary" data-ml="250">+250</button>
            <button type="button" class="primary" data-ml="500">+500</button>
            <button type="button" class="ghost" id="wUndo">Undo</button>
          </div>
          <label class="goalrow"
            >Daily goal (ml)
            <input id="goalIn" type="number" min="500" max="6000" step="250" />
          </label>
          <p class="small muted" id="tip"></p>
        </div>
      </section>
      <section>
        <h2>Last 7 days</h2>
        <div class="card"><div class="week" id="week"></div></div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
